<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin-Parimatch | Chat Manage</title>
  <link rel="stylesheet" href="../src/own-library.css">
  <link rel="stylesheet" href="admin-chat.css">
</head>
<body>

  <!-- Header -->
  <header style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:36px;height:36px;background:var(--accent);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.1rem;">A</div>
      <div>
        <div style="font-weight:700;font-size:0.95rem;">Admin-Parimatch</div>
        <div style="font-size:0.75rem;color:var(--muted);">Chat Manage</div>
      </div>
    </div>
    <button class="theme-toggle" aria-label="Toggle theme" title="Dark mode">
      <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>
  </header>

  <div style="padding:16px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <h2 style="font-size:1rem;font-weight:700;">Chats</h2>
      <span id="chatCount" class="badge neutral sm" style="font-size:0.7rem;">0</span>
    </div>

    <!-- Search -->
    <div class="field" style="margin-bottom:16px;">
      <label style="font-size:0.8rem;font-weight:600;color:var(--text);">Search user</label>
      <input type="text" id="chatSearch" placeholder="Search by name or mobile..." style="width:100%;height:42px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-family:inherit;font-size:0.9rem;">
    </div>

    <!-- Chat list -->
    <div class="card" id="chatList">
      <!-- Chat items injected here -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav style="position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:50;">
    <a href="index.html" class="nav-item" style="display:flex;flex-direction:column;align-items:center;color:var(--muted);text-decoration:none;font-size:0.7rem;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Home</span>
    </a>
    <a href="all-complaints.html" class="nav-item" style="display:flex;flex-direction:column;align-items:center;color:var(--muted);text-decoration:none;font-size:0.7rem;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
      <span>Complains</span>
    </a>
    <a href="chat-manage.html" class="nav-item active" style="display:flex;flex-direction:column;align-items:center;color:var(--accent);text-decoration:none;font-size:0.7rem;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span>Chat</span>
    </a>
    <a href="activity.html" class="nav-item" style="display:flex;flex-direction:column;align-items:center;color:var(--muted);text-decoration:none;font-size:0.7rem;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span>Activity</span>
    </a>
    <a href="setting.html" class="nav-item" style="display:flex;flex-direction:column;align-items:center;color:var(--muted);text-decoration:none;font-size:0.7rem;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:22px;height:22px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span>Setting</span>
    </a>
  </nav>

  <script src="admin-chat.js"></script>
</body>
</html>
