<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin-Parimatch | Chat</title>
  <link rel="stylesheet" href="../src/own-library.css">
  <link rel="stylesheet" href="admin-chat.css">
</head>
<body>

  <!-- Header -->
  <header class="chat-page-header">
    <button class="chat-back" onclick="history.back()">&#8592;</button>
    <div class="chat-user-header">
      <div class="chat-user-name" id="chatUserName">Loading...</div>
      <div class="chat-user-status" id="chatUserStatus"><span class="dot"></span> Online</div>
    </div>
    <button class="btn btn.ghost btn.sm" style="margin-left:auto;">&#128464;</button>
  </header>

  <div class="chat-messages" id="chatMessages">
    <!-- Messages injected by JS -->
    <div class="msg-date" id="msgDate">Today</div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Type a message..." class="chat-input">
    <button class="chat-send" id="chatSend">&#9654;</button>
  </div>

  <script src="admin-chat-detail.js"></script>
</body>
</html>
